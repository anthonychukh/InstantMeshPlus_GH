name: Test Yak package

on:
  workflow_dispatch:
    inputs:
      sign_macos:
        description: Sign and notarize the macOS worker when Apple credentials are configured.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: yak-test-${{ github.ref }}
  cancel-in-progress: false

env:
  YAK_CLI_VERSION: 0.13.0
  YAK_TEST_SOURCE: https://test.yak.rhino3d.com
  PACKAGE_NAME: instantmeshplus

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      sign_macos: ${{ inputs.sign_macos }}
    secrets: inherit

  push-test:
    needs: build
    runs-on: windows-2022
    environment: yak-test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/download-artifact@v5
        with:
          name: instantmeshplus-yak-both
          path: artifacts/yak/combined

      - name: Read package version
        shell: pwsh
        run: |
          [xml] $props = Get-Content -Raw -LiteralPath 'Directory.Build.props'
          $version = $props.Project.PropertyGroup.VersionPrefix
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Directory.Build.props does not define VersionPrefix.'
          }
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download pinned Yak CLI
        shell: pwsh
        run: |
          $yakPath = Join-Path $env:RUNNER_TEMP "yak-$env:YAK_CLI_VERSION.exe"
          Invoke-WebRequest `
            -Uri "https://files.mcneel.com/yak/tools/$env:YAK_CLI_VERSION/yak.exe" `
            -OutFile $yakPath
          "YAK_PATH=$yakPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $yakPath version
          if ($LASTEXITCODE -ne 0) { throw 'Downloaded Yak CLI did not run.' }

      - name: Require Yak test-server credential
        shell: pwsh
        env:
          YAK_TOKEN: ${{ secrets.YAK_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:YAK_TOKEN)) {
            throw 'The yak-test environment secret YAK_TOKEN is required.'
          }

      - name: Validate exact package pair
        shell: pwsh
        run: |
          .\scripts\Validate-YakPackages.ps1 `
            -Root .\artifacts\yak\combined `
            -Version $env:PACKAGE_VERSION `
            -ExpectedPlatform win,mac `
            -WriteList .\artifacts\yak\validated-archives.txt

      - name: Upload validated package artifact
        uses: actions/upload-artifact@v5
        with:
          name: instantmeshplus-yak-test-validated
          path: artifacts/yak/combined/*.yak
          if-no-files-found: error
          compression-level: 0

      - name: Push both distributions to Yak test server
        shell: pwsh
        env:
          YAK_TOKEN: ${{ secrets.YAK_TOKEN }}
        run: |
          $archives = @(Get-Content -LiteralPath '.\artifacts\yak\validated-archives.txt')
          if ($archives.Count -ne 2) { throw "Expected two validated archives, found $($archives.Count)." }
          foreach ($archive in $archives) {
            & $env:YAK_PATH push "--source=$env:YAK_TEST_SOURCE" $archive
            if ($LASTEXITCODE -ne 0) { throw "Yak test-server push failed for '$archive'." }
          }

      - name: Verify test-server package version
        shell: pwsh
        run: |
          .\scripts\Test-YakPackageVersion.ps1 `
            -YakPath $env:YAK_PATH `
            -Source $env:YAK_TEST_SOURCE `
            -PackageName $env:PACKAGE_NAME `
            -Version $env:PACKAGE_VERSION `
            -ShouldExist `
            -RetryCount 6 `
            -DelaySeconds 10
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @"
          ## Yak test-server verification

          Uploaded and validated Windows and macOS distributions for version `$env:PACKAGE_VERSION`.
          "@
